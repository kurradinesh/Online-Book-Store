<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BOOKNOOK · Cart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="storage-bar">
  <div class="left"><span>YOUR CART</span></div>
  <div class="right">
    <a href="index.html" class="auth-link">Continue Shopping</a>
    <a href="orders.html" class="auth-link">Orders</a>
    <button class="dark-toggle" id="darkModeToggle"><i class="fas fa-moon"></i></button>
  </div>
</div>

<div class="book-storage">
  <h2><i class="fas fa-shopping-cart"></i> Cart Items</h2>

  <div id="cartItemsList" class="cart-items-list"></div>

  <div class="cart-summary">
    <h3>Total: ₹<span id="cartTotal">0</span></h3>
    <div class="cart-actions-row">
      <button type="button" id="clearCartBtn" class="checkout-btn secondary">Clear Cart</button>
      <button type="button" id="checkoutBtn" class="checkout-btn">Buy Now</button>
    </div>
  </div>
</div>

<script src="js/books.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/order.js"></script>
<script src="js/cart.js"></script>
<script src="js/enhancements.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    try {
      const cart = JSON.parse(localStorage.getItem('booknook_cart') || '[]');
      console.info('Cart page loaded with', cart.length, 'item(s)');
    } catch (error) {
      console.error('Cart page storage read failed:', error);
    }
  });
</script>
</body>
</html>
