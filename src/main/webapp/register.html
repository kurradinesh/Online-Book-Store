<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BOOKNOOK · Create Account</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Fonts: Inter (clean, modern) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ---------- RESET & GLOBAL (same premium palette as login) ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #FFF3E0 0%, #FDE8D3 40%, #F5E3C9 100%);
      min-height: 100vh;
      transition: background 0.3s ease;
    }

    /* Dark mode – warm deep tones */
    body.dark {
      background: linear-gradient(135deg, #1E1B1A 0%, #2A241F 50%, #1F1B17 100%);
    }

    body.dark .glass-card {
      background: rgba(30, 26, 24, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(218, 185, 135, 0.3);
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
    }

    body.dark .glass-card:hover {
      background: rgba(40, 35, 32, 0.85);
      border: 1px solid rgba(218, 185, 135, 0.5);
    }

    body.dark .register-header h1 {
      background: linear-gradient(135deg, #F3D382, #E5B567);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    body.dark .register-header p,
    body.dark .input-group label,
    body.dark .terms-row label,
    body.dark .login-redirect span,
    body.dark .divider span,
    body.dark .demo-note,
    body.dark .social-icon {
      color: #F2E3D5;
    }

    body.dark .input-field input {
      background: rgba(40, 35, 32, 0.85);
      border-color: rgba(218, 185, 135, 0.4);
      color: #F9EDE0;
    }

    body.dark .input-field input:focus {
      background: rgba(55, 48, 43, 0.95);
      border-color: #E5B567;
      box-shadow: 0 0 0 4px rgba(229, 181, 103, 0.25);
    }

    body.dark .input-field i {
      color: #E5B567;
    }

    body.dark .divider-line {
      background: rgba(218, 185, 135, 0.3);
    }

    body.dark .social-icon {
      background: rgba(40, 35, 32, 0.7);
      color: #EAD6B0;
      border-color: rgba(218, 185, 135, 0.3);
    }

    body.dark .social-icon:hover {
      background: #C69C6D;
      color: #1F1B17;
    }

    body.dark .storage-bar,
    body.dark .warehouse-header,
    body.dark .warehouse-footer {
      background: #1F1B17dd;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(218, 185, 135, 0.2);
    }

    body.dark .inventory-badge {
      background: #2F2A24;
      color: #E5B567;
    }

    /* ----- top bar & header (identical to login) ----- */
    .storage-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 2rem;
      background: rgba(255, 248, 235, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      font-weight: 500;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .left span {
      color: #7A4C2C;
      font-weight: 600;
    }

    .right {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .auth-link {
      text-decoration: none;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      background: rgba(0, 0, 0, 0.04);
      color: #7A4C2C;
      transition: 0.2s;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .auth-link:hover {
      background: #ecd06f40;
    }

    .dark-toggle {
      background: #7A4C2C;
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .warehouse-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(255, 248, 235, 0.7);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      flex-wrap: wrap;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      font-size: 2rem;
      color: #C28A4E;
    }

    .logo-text {
      font-size: 1.8rem;
      font-weight: 800;
      color: #5A3A22;
      letter-spacing: -0.5px;
    }

    .logo-text span {
      font-size: 0.8rem;
      font-weight: 500;
      display: block;
      color: #A67548;
    }

    .inventory-badge {
      background: #F0E0C7;
      padding: 0.4rem 1rem;
      border-radius: 100px;
      font-weight: 600;
      color: #8B5A2B;
      font-size: 0.85rem;
    }

    .warehouse-footer {
      margin-top: 3rem;
      background: rgba(255, 248, 235, 0.7);
      backdrop-filter: blur(8px);
      text-align: center;
      padding: 1.2rem;
      font-size: 0.8rem;
      color: #7A4C2C;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
    }

    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1100;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* ---- modern two‑column grid (glassmorphism + illustration) ---- */
    .auth-container-modern {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .register-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: center;
      animation: fadeSlideUp 0.6s ease-out;
    }

    .illustration-col {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .svg-wrapper {
      max-width: 520px;
      width: 100%;
      transition: transform 0.3s ease;
    }

    .svg-wrapper:hover {
      transform: translateY(-6px);
    }

    /* glass card – warm cream with amber accents */
    .glass-card {
      background: rgba(255, 248, 235, 0.65);
      backdrop-filter: blur(14px);
      border-radius: 2.5rem;
      padding: 2.2rem 2rem 2.5rem;
      width: 100%;
      max-width: 550px;
      margin: 0 auto;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(255, 245, 225, 0.8) inset;
      transition: all 0.35s ease;
      border: 1px solid rgba(218, 185, 135, 0.5);
    }

    .glass-card:hover {
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.12);
      background: rgba(255, 248, 235, 0.8);
      border: 1px solid rgba(218, 185, 135, 0.8);
    }

    .register-header {
      margin-bottom: 1.8rem;
    }

    .register-header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #8B5A2B, #C28A4E);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .register-header p {
      color: #7A4C2C;
      font-weight: 500;
      margin-top: 0.5rem;
    }

    .input-group {
      margin-bottom: 1.4rem;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #5A3A22;
      margin-bottom: 0.5rem;
    }

    .input-field {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field i {
      position: absolute;
      left: 1rem;
      color: #C28A4E;
      font-size: 1.1rem;
    }

    .input-field input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 2.8rem;
      font-size: 1rem;
      border: 1.5px solid rgba(218, 185, 135, 0.6);
      background: rgba(255, 255, 240, 0.85);
      border-radius: 1.8rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      transition: all 0.2s;
      outline: none;
      color: #4A2E1A;
    }

    .input-field input:focus {
      border-color: #C28A4E;
      background: rgba(255, 255, 245, 0.98);
      box-shadow: 0 0 0 4px rgba(194, 138, 78, 0.2);
    }

    .terms-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 1.2rem 0 1.5rem;
    }

    .terms-row input {
      width: 18px;
      height: 18px;
      accent-color: #C28A4E;
    }

    .terms-row label {
      font-size: 0.85rem;
      color: #5A3A22;
      font-weight: 500;
    }

    .terms-link {
      color: #C28A4E;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    .register-btn {
      width: 100%;
      background: linear-gradient(105deg, #A67548, #C28A4E);
      border: none;
      padding: 0.9rem;
      border-radius: 2rem;
      font-size: 1rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 8px 20px rgba(166, 117, 72, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .register-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(105deg, #B8865A, #D9A066);
      box-shadow: 0 12px 28px rgba(166, 117, 72, 0.4);
    }

    .social-section {
      margin: 1.8rem 0 1.2rem;
      text-align: center;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #8B6540;
      font-size: 0.8rem;
      margin-bottom: 1.3rem;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: rgba(139, 101, 64, 0.2);
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .social-icon {
      background: rgba(255, 248, 235, 0.8);
      backdrop-filter: blur(4px);
      width: 48px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 1.5rem;
      color: #A67548;
      transition: 0.2s;
      cursor: pointer;
      border: 1px solid rgba(218, 185, 135, 0.6);
    }

    .social-icon:hover {
      background: #C28A4E;
      transform: translateY(-4px);
      color: white;
      border-color: #C28A4E;
    }

    .login-redirect {
      text-align: center;
      margin-top: 1.3rem;
      font-size: 0.9rem;
    }

    .login-redirect a {
      font-weight: 700;
      color: #A67548;
      text-decoration: none;
      margin-left: 6px;
    }

    .login-redirect a:hover {
      text-decoration: underline;
      color: #8B5A2B;
    }

    .demo-note {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.7rem;
      color: #9B7652;
      font-weight: 500;
    }

    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(30px);}
      100% { opacity: 1; transform: translateY(0);}
    }

    @media (max-width: 880px) {
      .register-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .illustration-col { order: 1; }
      .card-col { order: 2; }
      .svg-wrapper { max-width: 340px; }
      .glass-card { padding: 1.8rem; }
    }

    @media (max-width: 550px) {
      .storage-bar, .warehouse-header { padding: 0.8rem 1rem; }
      .logo-text { font-size: 1.4rem; }
    }
  </style>
</head>

<!-- Replace the existing <script> block with this one -->
<script>
  // ---------- ORIGINAL VALIDATION PRESERVED, NOW WITH AJAX SUBMISSION & REDIRECT ----------
  const registerForm = document.getElementById('registerFormPage');

  registerForm.addEventListener('submit', async function(e) {
    e.preventDefault();  // Prevent normal form submission (we handle via fetch)

    // --- All original validation checks (unchanged) ---
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;
    const terms = document.getElementById('termsCheckbox').checked;

    if (!name || !email || !password || !confirm) {
      showToast('All fields are required', 'error');
      return;
    }
    if (password !== confirm) {
      showToast('Passwords do not match', 'error');
      return;
    }
    if (password.length < 6) {
      showToast('Password must be at least 6 characters', 'error');
      return;
    }
    if (!terms) {
      showToast('You must agree to the Terms & Conditions', 'error');
      return;
    }

    // --- If validation passes, submit via AJAX to the same servlet ---
    const formData = new FormData(registerForm);
    
    try {
      showToast('Processing registration...', 'success');
      
      const response = await fetch(registerForm.action, {
        method: 'POST',
        credentials: 'same-origin',
        body: formData
      });

      if (response.ok) {
        // Registration successful – redirect to index.html
        showToast('Registration successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      } else {
        // Server returned an error (e.g., duplicate email, validation error)
        const errorText = await response.text();
        showToast('Registration failed: ' + (errorText || 'Please try again'), 'error');
      }
    } catch (err) {
      console.error('Network error:', err);
      showToast('Network error. Please check your connection.', 'error');
    }
  });

  window.socialSignup = function(provider) {
    showToast(`Social integration via ${provider} coming soon!`, 'info');
  };

  const termsTrigger = document.getElementById('termsModalTrigger');
  if (termsTrigger) {
    termsTrigger.addEventListener('click', () => {
      showToast('📜 BOOKNOOK Terms: Respectful reading, privacy first. Full terms available in footer.', 'info');
    });
  }

  // Dark mode toggle (unchanged)
  const darkToggleBtn = document.getElementById('darkModeToggle');
  if (localStorage.getItem('darkMode') === 'enabled') {
    document.body.classList.add('dark');
    const icon = darkToggleBtn?.querySelector('i');
    if (icon) { icon.classList.remove('fa-moon'); icon.classList.add('fa-sun'); }
  }
  if (darkToggleBtn) {
    darkToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
      const icon = darkToggleBtn.querySelector('i');
      if (icon) {
        if (isDark) { icon.classList.remove('fa-moon'); icon.classList.add('fa-sun'); }
        else { icon.classList.remove('fa-sun'); icon.classList.add('fa-moon'); }
      }
    });
  }
</script>
</body>
</html>
